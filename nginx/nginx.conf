events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    server_tokens off;

    upstream frontend_server { server frontend:3000; }
    upstream backend_server  { server backend:8000; }

    # API Rate Limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;

    # WebSocket Connection Limit
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    server {
        listen 80;
        client_max_body_size 10M;  # Limit request body size
        server_name localhost;

        # Frontend & Next.js Development Server HMR
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Explicitly support Next.js 13/14/15 development hot-reloading streams
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Backend API
        location ~ ^/(api|admin)/ {
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            limit_req zone=api_limit burst=20 nodelay;
        }

        # Django Static Files
        location /static/ {
            alias /usr/src/flux/static/;
            expires 30d;
            add_header Cache-Control "public, immutable";
            charset utf-8;
        }

        # Django Media Files
        location /media/ {
            alias /usr/src/flux/media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # Frontend Public Assets
        location /public/ {
            alias /app/public/;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # WebSocket
        location /ws/ {
            proxy_pass http://backend_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Connection timeouts
            proxy_read_timeout 86400;  
            proxy_send_timeout 86400;
            
            # Disable buffering to ensure instant ticket data delivery
            proxy_buffering off;
            proxy_redirect off;
            
            # Buffer management for larger updates
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;

            limit_conn addr 500;  
        }
    }
}