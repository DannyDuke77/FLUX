events {}

http {
    include /etc/nginx/mime.types;
    server_tokens off; # Hide Nginx version

    upstream frontend_server { server frontend:3000; }
    upstream backend_server  { server backend:8000; }
    upstream daphne_server   { server daphne:8001; }

    # 1. API Rate Limit
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s; # 10 requests per minute

    # 2. WebSocket  Handshakes Connection Limit
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Redirect HTTP to HTTPS
    server {
        listen 80;
        server_name tickets.local;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name tickets.local;

        # SSL Certificate Paths (Inside the container)
        ssl_certificate     /etc/nginx/ssl/tickets.local.pem;
        ssl_certificate_key /etc/nginx/ssl/tickets.local-key.pem;

        # Basic Hardening
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        # Frontend Traffic
        location / {
            proxy_pass http://frontend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Django API/Admin
        location ~ ^/(api|admin)/ {
            limit_req zone=api_limit burst=10 nodelay;
            proxy_pass http://backend_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /usr/src/flux/staticfiles/;
            expires 30d;
            add_header Cache-Control "public";
            charset utf-8;
        }

        location /ws/ {
            limit_conn addr 5; # 5 connections per IP
            proxy_pass http://daphne_server;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}